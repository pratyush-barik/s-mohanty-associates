name: Auto Trigger Vercel Deploy for Collaborator Push

on:
  push:
    branches:
      - main

jobs:
  auto-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Optional: Trigger Vercel Deploy Hook if configured
      - name: Trigger Vercel Deploy Hook
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel Deployment via Deploy Hook..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Deployment triggered successfully on Vercel!"

      # Auto-touch commit as Owner (ensures Vercel triggers deployment for collaborator pushes)
      - name: Checkout repository
        if: github.actor != 'pratyush-barik' && !contains(github.event.head_commit.message, '[skip actions]')
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_DEPLOY_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git as Owner
        if: github.actor != 'pratyush-barik' && !contains(github.event.head_commit.message, '[skip actions]')
        run: |
          git config user.name "Pratyush Barik"
          git config user.email "scarlight.c39@gmail.com"

      - name: Touch CLAUDE.md and Push as Owner
        if: github.actor != 'pratyush-barik' && !contains(github.event.head_commit.message, '[skip actions]')
        run: |
          echo "" >> CLAUDE.md
          git add CLAUDE.md
          git commit -m "chore: auto-trigger deployment for collaborator push [skip actions]"
          git push origin main
