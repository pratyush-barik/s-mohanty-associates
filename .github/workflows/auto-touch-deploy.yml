name: Auto Trigger Vercel Deploy for Collaborator Push

on:
  push:
    branches:
      - main

jobs:
  auto-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Option 1: Direct Vercel Deploy Hook (Recommended - 100% reliable, zero dummy commits)
      - name: Trigger Vercel Deploy Hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Vercel Deployment via Deploy Hook..."
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully on Vercel!"

      # Option 2: Fallback Auto-touch commit via PAT
      - name: Checkout repository
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL == '' && github.actor != 'pratyush-barik' && !contains(github.event.head_commit.message, '[skip actions]') }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_DEPLOY_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git as Owner
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL == '' && github.actor != 'pratyush-barik' && !contains(github.event.head_commit.message, '[skip actions]') }}
        run: |
          git config user.name "Pratyush Barik"
          git config user.email "scarlight.c39@gmail.com"

      - name: Touch CLAUDE.md and Push as Owner
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL == '' && github.actor != 'pratyush-barik' && !contains(github.event.head_commit.message, '[skip actions]') }}
        run: |
          echo "" >> CLAUDE.md
          git add CLAUDE.md
          git commit -m "chore: auto-trigger deployment for collaborator push [skip actions]"
          git push origin main
