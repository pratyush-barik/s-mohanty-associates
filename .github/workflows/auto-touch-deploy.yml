name: Auto Trigger Vercel Deploy for Collaborator Push

on:
  push:
    branches:
      - main

jobs:
  auto-touch-deploy:
    # Only run when a collaborator pushes (not when the owner or bot pushes)
    if: github.actor != 'pratyush-barik' && !contains(github.event.head_commit.message, '[skip actions]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git as Owner
        run: |
          git config user.name "Pratyush Barik"
          git config user.email "scarlight.c39@gmail.com"

      - name: Touch CLAUDE.md and Push as Owner
        run: |
          echo "" >> CLAUDE.md
          git add CLAUDE.md
          git commit -m "chore: auto-trigger deployment for collaborator push [skip actions]"
          git push origin main
